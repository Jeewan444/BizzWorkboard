<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizz Workboard Prototype</title>
    <!-- Import map allows the browser to resolve bare imports like "react" -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <!-- Babel standalone compiles JSX in the browser on the fly -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #080b16;
        }

        #root {
            display: flex;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Load and compile the JSX file -->
    <script type="text/babel" data-type="module" src="./Companyworkboard.jsx"></script>
</body>

</html>
